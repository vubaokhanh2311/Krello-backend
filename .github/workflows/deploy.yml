name: Deploy NestJS Backend (DEV)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy backend via SSH
        run: |
          ssh be_vm << 'EOF'
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && . "$NVM_DIR/bash_completion"

            node -v
            npm -v

            cd /home/krello/krello-server
            git pull origin dev
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart krello-api
          EOF
