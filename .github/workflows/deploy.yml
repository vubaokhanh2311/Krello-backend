name: Deploy NestJS Backend (DEV)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Deploy to Development Server
    runs-on: self-hosted

    steps:
      - name: Deploy backend via SSH
        run: |
          ssh -o StrictHostKeyChecking=no be_vm << 'EOF'
            set -e

            # Source NVM environment
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "=== Node Environment ==="
            node -v
            npm -v

            cd /home/krello/krello-server

            echo "=== Syncing Latest Code ==="
            git fetch origin dev
            git checkout dev
            git reset --hard origin/dev

            echo "=== Installing Dependencies ==="
            npm ci

            echo "=== Prisma Generate & Migrate ==="
            npx prisma generate
            npx prisma migrate deploy

            echo "=== Building Application ==="
            npm run build

            echo "=== Reloading PM2 (Zero-Downtime) ==="
            if pm2 describe krello-api > /dev/null 2>&1; then
              pm2 reload krello-api --update-env
            else
              pm2 start dist/main.js --name krello-api
            fi
            pm2 save

            echo "=== Deployment Completed Successfully ==="
          EOF
