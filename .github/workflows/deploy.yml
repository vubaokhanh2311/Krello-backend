name: Deploy NestJS Backend (DEV)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy backend
        run: |
          set -e
          cd /home/krello/krello-server
          git pull origin dev
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          pm2 restart krello-api
