name: Deploy NestJS Backend (DEV)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy backend via SSH
        run: |
          ssh be_vm << 'EOF'
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            echo "Node version:"
            which node
            node -v
            npm -v

            cd /home/krello/krello-server

            echo "Sync code"
            git fetch origin
            git checkout dev
            git reset --hard origin/dev

            echo "Install deps"
            npm ci

            echo "Prisma"
            npx prisma generate
            npx prisma migrate deploy

            echo "Build"
            npm run build

            echo "Restart PM2"
            pm2 restart krello-api
            pm2 save
          EOF
