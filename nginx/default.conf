server {
    listen 80;
    server_name api.krello.click;

    # Giới hạn kích thước file upload
    client_max_body_size 50M;

    # Proxy tới NestJS API container (service name trong docker-compose là 'api')
    location / {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        # Hỗ trợ WebSocket / Real-time connections
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Forward IP và Host thông tin tới Backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    # (Tùy chọn) Phục vụ trực tiếp file static/uploads từ Volume để tối ưu hiệu năng
    location /uploads/ {
        alias /app/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
